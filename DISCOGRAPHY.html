<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Phantom Heartbeats — Discography
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="index.html"
                class="logo"
            >
                PHANTOM HEARTBEATS
            </a>


            <nav class="main-nav">

                <a
                    href="index.html"
                    class="nav-button"
                >
                    HOME
                </a>


                <a
                    href="DISCOGRAPHY.html"
                    class="nav-button active"
                >
                    MUSIC
                </a>


                <a
                    href="SOCIALS.html"
                    class="nav-button"
                >
                    SOCIALS
                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         MUSIC PAGE
    ====================================================== -->

    <main class="page active">


        <!-- =================================================
             HERO
        ================================================== -->

        <section class="hero">

            <h1>
                PHANTOM HEARTBEATS
            </h1>


            <div class="eyebrow">
                DISCOGRAPHY
            </div>

        </section>



        <!-- =================================================
             LATEST RELEASE
        ================================================== -->

        <section
            class="latest-release"
            id="latest-release-section"
        >

            <div class="section-header">

                <div class="eyebrow">
                    LATEST RELEASE
                </div>

            </div>


            <div
                class="featured-release"
                id="featured-release"
            ></div>

        </section>



        <!-- =================================================
             ALBUMS
        ================================================== -->

        <section
            class="catalog-section"
            id="albums-section"
        >

            <div class="section-header">

                <div class="eyebrow">
                    ALBUMS
                </div>

            </div>


            <div
                class="release-grid"
                id="albums-grid"
            ></div>

        </section>



        <!-- =================================================
             EPS
        ================================================== -->

        <section
            class="catalog-section"
            id="eps-section"
        >

            <div class="section-header">

                <div class="eyebrow">
                    EPs
                </div>

            </div>


            <div
                class="release-grid"
                id="eps-grid"
            ></div>

        </section>



        <!-- =================================================
             SINGLES
        ================================================== -->

        <section
            class="catalog-section"
            id="singles-section"
        >

            <div class="section-header">

                <div class="eyebrow">
                    SINGLES
                </div>

            </div>


            <div
                class="release-grid"
                id="singles-grid"
            ></div>

        </section>



        <!-- =================================================
             FEATURED
        ================================================== -->

        <section
            class="catalog-section"
            id="featured-section"
        >

            <div class="section-header">

                <div class="eyebrow">
                    FEATURED
                </div>

            </div>


            <div
                class="release-grid"
                id="featured-grid"
            ></div>

        </section>



        <!-- =================================================
             TRACKLIST
        ================================================== -->

        <section
            id="tracklist-section"
            class="track-section hidden"
        >

            <div class="section-header">

                <div
                    class="eyebrow"
                    id="tracklist-heading"
                >
                    TRACKLIST
                </div>

            </div>


            <div
                id="tracks"
                class="tracklist"
            ></div>

        </section>

    </main>



    <!-- =====================================================
         MUSIC PLAYER
    ====================================================== -->

    <div
        class="music-player"
        id="music-player"
    >


        <div class="player-track-info">

            <img
                id="player-artwork"
                src=""
                alt=""
            >


            <div class="player-track-text">

                <div
                    id="player-title"
                    class="player-title"
                >
                    Select a track
                </div>


                <div
                    id="player-artist"
                    class="player-artist"
                >
                    Phantom Heartbeats
                </div>

            </div>

        </div>



        <div class="player-center">

            <div class="player-controls">

                <!-- SHUFFLE -->

                <button
                    id="shuffle-button"
                    class="player-control"
                    aria-label="Shuffle off"
                    title="Shuffle off"
                >
                    <span class="control-icon">
                        🔀
                    </span>
                </button>


                <!-- PREVIOUS -->

                <button
                    id="previous-button"
                    class="player-control"
                    aria-label="Previous track"
                    title="Previous"
                >
                    <span class="control-icon">
                        ⏮
                    </span>
                </button>


                <!-- PLAY / PAUSE -->

                <button
                    id="play-button"
                    class="player-control player-play"
                    onclick="togglePlay()"
                    aria-label="Play"
                    title="Play"
                >
                    <span class="control-icon">
                        ▶
                    </span>
                </button>


                <!-- NEXT -->

                <button
                    id="next-button"
                    class="player-control"
                    aria-label="Next track"
                    title="Next"
                >
                    <span class="control-icon">
                        ⏭
                    </span>
                </button>

            </div>



            <div class="player-progress">

                <span id="current-time">
                    0:00
                </span>


                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                    aria-label="Track progress"
                >


                <span id="duration">
                    0:00
                </span>

            </div>

        </div>



        <div class="player-volume">

            <span
                id="volume-icon"
                class="volume-icon"
            >
                🔊
            </span>


            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
                aria-label="Volume"
            >


            <span id="volume-value">
                100%
            </span>

        </div>

    </div>



    <!-- =====================================================
         AUDIO
    ====================================================== -->

    <audio
        id="audio"
        preload="metadata"
    ></audio>



    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="player.js"></script>



    <!-- =====================================================
         DISCOGRAPHY LOGIC
    ====================================================== -->

    <script>

        const SUPABASE_URL =
            "https://wayjatvqnbqyzmwnbabp.supabase.co";


        const SUPABASE_ANON_KEY =
            "sb_publishable_UUx-z6V2gMIaEsedYj4ZBA_Q750jG2_";


        const WORKER_URL =
            "https://phantom-heartbeats-api.3huvelyk.workers.dev";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );



        /* =====================================================
           STATE
        ====================================================== */

        let releases = [];

        let releaseTracks = {};



        /* =====================================================
           DOM
        ====================================================== */

        const featuredRelease =
            document.getElementById(
                "featured-release"
            );


        const albumsGrid =
            document.getElementById(
                "albums-grid"
            );


        const epsGrid =
            document.getElementById(
                "eps-grid"
            );


        const singlesGrid =
            document.getElementById(
                "singles-grid"
            );


        const featuredGrid =
            document.getElementById(
                "featured-grid"
            );


        const tracklistSection =
            document.getElementById(
                "tracklist-section"
            );


        const tracklistHeading =
            document.getElementById(
                "tracklist-heading"
            );


        const trackContainer =
            document.getElementById(
                "tracks"
            );



        /* =====================================================
           FILE URL
        ====================================================== */

        function r2Url(
            value
        ) {

            if (!value) {
                return "";
            }


            if (
                value.startsWith(
                    "http://"
                ) ||
                value.startsWith(
                    "https://"
                )
            ) {

                return value;

            }


            return (
                WORKER_URL +
                "/file?key=" +
                encodeURIComponent(
                    value
                )
            );

        }



        /* =====================================================
           FORMAT YEAR
        ====================================================== */

        function formatReleaseYear(
            releaseDate
        ) {

            if (!releaseDate) {
                return "";
            }


            return new Date(
                releaseDate +
                "T00:00:00"
            ).getFullYear();

        }



        /* =====================================================
           FORMAT RUNTIME
        ====================================================== */

        function formatRuntime(
            seconds
        ) {

            if (
                !seconds ||
                !Number.isFinite(
                    Number(seconds)
                )
            ) {

                return "--:--";

            }


            const total =
                Math.floor(
                    Number(seconds)
                );


            const minutes =
                Math.floor(
                    total / 60
                );


            const remaining =
                total % 60;


            return (
                minutes +
                ":" +
                String(
                    remaining
                ).padStart(
                    2,
                    "0"
                )
            );

        }



        /* =====================================================
           LOAD RELEASES
        ====================================================== */

        async function loadReleases() {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from(
                            "releases"
                        )
                        .select(
                            "*"
                        )
                        .eq(
                            "published",
                            true
                        )
                        .order(
                            "release_date",
                            {
                                ascending:
                                    false,
                                nullsFirst:
                                    false
                            }
                        );


                if (error) {
                    throw error;
                }


                releases =
                    data || [];


                await loadAllTracks();


                renderReleases();


            } catch (error) {

                console.error(
                    "Could not load discography:",
                    error
                );


                showLoadError();

            }

        }



        /* =====================================================
           LOAD TRACKS
        ====================================================== */

        async function loadAllTracks() {

            releaseTracks = {};


            if (!releases.length) {
                return;
            }


            const releaseIds =
                releases.map(
                    release =>
                        release.id
                );


            const {
                data,
                error
            } =
                await supabaseClient
                    .from(
                        "tracks"
                    )
                    .select(
                        "*"
                    )
                    .in(
                        "release_id",
                        releaseIds
                    )
                    .order(
                        "track_number",
                        {
                            ascending:
                                true
                        }
                    );


            if (error) {
                throw error;
            }


            for (
                const release
                of releases
            ) {

                releaseTracks[
                    release.id
                ] =
                    (
                        data || []
                    )
                    .filter(
                        track =>
                            track.release_id ===
                            release.id
                    )
                    .sort(
                        (
                            a,
                            b
                        ) =>
                            a.track_number -
                            b.track_number
                    );

            }

        }



        /* =====================================================
           PLAYER TRACK DATA
        ====================================================== */

        function getPlayerTracks(
            release
        ) {

            const sourceTracks =
                releaseTracks[
                    release.id
                ] || [];


            return sourceTracks
                .filter(
                    track =>
                        !!track.audio_url
                )
                .map(
                    track => {

                        return {

                            id:
                                track.id,


                            releaseId:
                                release.id,


                            releaseTitle:
                                release.title,


                            title:
                                track.title,


                            artists:
                                track.artists ||
                                release.artists ||
                                "Phantom Heartbeats",


                            file:
                                r2Url(
                                    track.audio_url
                                ),


                            artwork:
                                r2Url(
                                    release.cover_url
                                ),


                            duration:
                                Number(
                                    track.duration_seconds
                                ) || 0

                        };

                    }
                );

        }



        /* =====================================================
           RELEASE CARD
        ====================================================== */

        function createReleaseCard(
            release
        ) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "release-card";


            const artworkUrl =
                r2Url(
                    release.cover_url
                );


            const year =
                formatReleaseYear(
                    release.release_date
                );


            const displayType =
                release.type === "featured"
                    ? "FEATURED"
                    : release.type.toUpperCase();


            card.innerHTML = `

                <div class="release-card-artwork">

                    ${
                        artworkUrl
                            ? `
                                <img
                                    src="${escapeHtml(
                                        artworkUrl
                                    )}"
                                    alt="${escapeHtml(
                                        release.title
                                    )} artwork"
                                    loading="lazy"
                                >
                            `
                            : ""
                    }

                </div>


                <div class="release-card-info">

                    <h3>
                        ${escapeHtml(
                            release.title
                        )}
                    </h3>


                    <p>
                        ${displayType}

                        ${
                            year
                                ? ` · ${year}`
                                : ""
                        }
                    </p>

                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    showReleaseTracks(
                        release.id
                    );

                }
            );


            return card;

        }



        /* =====================================================
           LATEST RELEASE
        ====================================================== */

        function renderFeatured() {

            if (
                !featuredRelease
            ) {
                return;
            }


            if (!releases.length) {

                featuredRelease.innerHTML = `
                    <p>
                        No releases published yet.
                    </p>
                `;


                return;

            }


            const release =
                releases[0];


            const artworkUrl =
                r2Url(
                    release.cover_url
                );


            const tracks =
                releaseTracks[
                    release.id
                ] || [];


            const runtime =
                tracks.reduce(
                    (
                        total,
                        track
                    ) =>
                        total +
                        (
                            Number(
                                track.duration_seconds
                            ) || 0
                        ),
                    0
                );


            const year =
                formatReleaseYear(
                    release.release_date
                );


            const displayType =
                release.type === "featured"
                    ? "FEATURED"
                    : release.type.toUpperCase();


            const displayTypeTitle =
                release.type === "featured"
                    ? "Featured"
                    : (
                        release.type
                            .charAt(0)
                            .toUpperCase() +
                        release.type.slice(1)
                    );


            featuredRelease.innerHTML = `

                <div
                    class="release-artwork"
                    id="featured-release-artwork"
                >

                    ${
                        artworkUrl
                            ? `
                                <img
                                    src="${escapeHtml(
                                        artworkUrl
                                    )}"
                                    alt="${escapeHtml(
                                        release.title
                                    )} artwork"
                                >
                            `
                            : ""
                    }

                </div>


                <div class="release-info">

                    <div class="eyebrow">
                        ${displayType}
                    </div>


                    <h2>
                        ${escapeHtml(
                            release.title
                        )}
                    </h2>


                    <p class="release-description">
                        ${escapeHtml(
                            release.artists ||
                            "Phantom Heartbeats"
                        )}
                    </p>


                    <p class="release-meta">

                        ${displayTypeTitle}

                        ${
                            year
                                ? ` · ${year}`
                                : ""
                        }

                        ·

                        <span>
                            ${formatRuntime(
                                runtime
                            )}
                        </span>

                    </p>


                    <button
                        class="play-album-button"
                        id="featured-play-button"
                    >
                        PLAY ${displayType}
                    </button>

                </div>

            `;


            const artwork =
                document.getElementById(
                    "featured-release-artwork"
                );


            if (artwork) {

                artwork.addEventListener(
                    "click",
                    () => {

                        showReleaseTracks(
                            release.id
                        );

                    }
                );

            }


            const playFeaturedButton =
                document.getElementById(
                    "featured-play-button"
                );


            if (
                playFeaturedButton
            ) {

                playFeaturedButton.addEventListener(
                    "click",
                    () => {

                        const playerTracks =
                            getPlayerTracks(
                                release
                            );


                        if (
                            !playerTracks.length
                        ) {

                            console.warn(
                                "No playable tracks."
                            );


                            return;

                        }


                        window.setPlayerTracks(
                            playerTracks
                        );


                        playTrack(
                            0
                        );

                    }
                );

            }

        }



        /* =====================================================
           RENDER CATALOG
        ====================================================== */

        function renderCatalog(
            type,
            container
        ) {

            if (!container) {
                return;
            }


            container.innerHTML =
                "";


            const filtered =
                releases.filter(
                    release =>
                        release.type ===
                        type
                );


            filtered.forEach(
                release => {

                    container.appendChild(
                        createReleaseCard(
                            release
                        )
                    );

                }
            );

        }



        /* =====================================================
           RENDER EVERYTHING
        ====================================================== */

        function renderReleases() {

            renderFeatured();


            renderCatalog(
                "album",
                albumsGrid
            );


            renderCatalog(
                "ep",
                epsGrid
            );


            renderCatalog(
                "single",
                singlesGrid
            );


            renderCatalog(
                "featured",
                featuredGrid
            );


            toggleSectionVisibility(
                "albums-section",
                releases.some(
                    release =>
                        release.type ===
                        "album"
                )
            );


            toggleSectionVisibility(
                "eps-section",
                releases.some(
                    release =>
                        release.type ===
                        "ep"
                )
            );


            toggleSectionVisibility(
                "singles-section",
                releases.some(
                    release =>
                        release.type ===
                        "single"
                )
            );


            toggleSectionVisibility(
                "featured-section",
                releases.some(
                    release =>
                        release.type ===
                        "featured"
                )
            );


            if (
                releases.length
            ) {

                showReleaseTracks(
                    releases[0].id,
                    false
                );

            }

        }



        /* =====================================================
           SHOW TRACKLIST
        ====================================================== */

        function showReleaseTracks(
            releaseId,
            scroll = true
        ) {

            const release =
                releases.find(
                    item =>
                        item.id ===
                        releaseId
                );


            if (!release) {
                return;
            }


            const sourceTracks =
                releaseTracks[
                    release.id
                ] || [];


            const playerTracks =
                getPlayerTracks(
                    release
                );


            window.setPlayerTracks(
                playerTracks
            );


            tracklistHeading.textContent =
                `${release.title.toUpperCase()} · TRACKLIST`;


            trackContainer.innerHTML =
                "";


            if (!sourceTracks.length) {

                trackContainer.innerHTML = `
                    <div class="track">
                        <div class="track-name">
                            No tracks available.
                        </div>
                    </div>
                `;

            } else {

                sourceTracks.forEach(
                    (
                        sourceTrack,
                        index
                    ) => {

                        const playableIndex =
                            playerTracks.findIndex(
                                track =>
                                    track.id ===
                                    sourceTrack.id
                            );


                        const element =
                            document.createElement(
                                "div"
                            );


                        element.className =
                            "track";


                        element.dataset.index =
                            playableIndex;


                        const duration =
                            sourceTrack.duration_seconds
                                ? formatRuntime(
                                    sourceTrack.duration_seconds
                                )
                                : "--:--";


                        element.innerHTML = `

                            <div class="track-number">
                                ${String(
                                    sourceTrack.track_number ||
                                    index + 1
                                ).padStart(
                                    2,
                                    "0"
                                )}
                            </div>


                            <div class="track-name">
    ${escapeHtml(
        sourceTrack.title
    )}

    <div class="track-artist">
        ${escapeHtml(
            sourceTrack.artists ||
            release.artists ||
            "Phantom Heartbeats"
        )}
    </div>
</div>

                            <div
                                class="track-duration"
                                id="duration-${playableIndex}"
                            >
                                ${duration}
                            </div>

                        `;


                        if (
                            playableIndex >= 0
                        ) {

                            element.addEventListener(
                                "click",
                                () => {

                                    playTrack(
                                        playableIndex
                                    );

                                }
                            );

                        }


                        trackContainer.appendChild(
                            element
                        );

                    }
                );

            }


            tracklistSection.classList.remove(
                "hidden"
            );


            if (scroll) {

                tracklistSection.scrollIntoView({
                    behavior:
                        "smooth",

                    block:
                        "start"
                });

            }

        }



        /* =====================================================
           SECTION VISIBILITY
        ====================================================== */

        function toggleSectionVisibility(
            id,
            visible
        ) {

            const section =
                document.getElementById(
                    id
                );


            if (!section) {
                return;
            }


            section.style.display =
                visible
                    ? ""
                    : "none";

        }



        /* =====================================================
           ERROR
        ====================================================== */

        function showLoadError() {

            featuredRelease.innerHTML = `
                <p>
                    Unable to load discography.
                </p>
            `;

        }



        /* =====================================================
           HTML ESCAPE
        ====================================================== */

        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        /* =====================================================
           INITIALIZE
        ====================================================== */

        loadReleases();

    </script>

</body>

</html>
